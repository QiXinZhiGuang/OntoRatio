<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700">
  <!--
    OntoRatio —— Ontology Layer & Semantic Layer Architecture (English)
    Mirror of ontology_semantic_architecture.svg (Chinese, default).
    Keep both SVG files in sync on every change.
  -->
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D44040"/>
      <stop offset="50%" stop-color="#7B78C8"/>
      <stop offset="100%" stop-color="#4A90D4"/>
    </linearGradient>
    <linearGradient id="dividerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#F0CDCB"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="82%" stop-color="#B8D4F0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="modelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EBF4FF"/>
      <stop offset="100%" stop-color="#DCEBFA"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#64748B" flood-opacity=".12"/>
    </filter>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#D44040" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowModel" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#6AAAD8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#4A90D4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowLavender" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1,1 L8,5 L1,9" fill="none" stroke="#B8A8E8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      @keyframes flow{to{stroke-dashoffset:-18}}
      @keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
      .flow{stroke-dasharray:7 5;animation:flow .9s linear infinite}
      .soft-pulse{animation:pulse 3s ease-in-out infinite}
      .label{font-family:"Inter","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#2B6FAC}
      .small-label{font-family:"Inter","PingFang SC","Noto Sans CJK SC",sans-serif;fill:#3A7CBD}
      .business-label{fill:#B5302A}
      .ontology-label{fill:#7463B3}
      .concept-label{fill:#8C6A15}
      .model-label{fill:#2B6FAC}
      .database-label{fill:#2B6FAC}
    </style>
  </defs>

  <rect width="1280" height="700" rx="20" fill="#FFFFFF"/>
  <rect x=".5" y=".5" width="1279" height="699" rx="19.5" fill="none" stroke="#E2E8F0"/>

  <text x="640" y="43" text-anchor="middle" font-family="Inter,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="800" letter-spacing="2" fill="url(#titleGrad)">ontoRatio</text>
  <text x="640" y="79" text-anchor="middle" font-family="Inter,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="26" font-weight="900" fill="#1D4E7E">Ontology Layer &amp; Semantic Layer Architecture</text>
  <text x="640" y="104" text-anchor="middle" font-family="Inter,'PingFang SC','Noto Sans CJK SC',sans-serif" font-size="14" fill="#3A7CBD">Mapping business forms to data structures and semantic definitions</text>
  <rect x="48" y="122" width="1184" height="2" rx="1" fill="url(#dividerGrad)"/>

  <!-- Context boundaries -->
  <text x="74" y="157" text-anchor="middle" class="label business-label" font-size="17" font-weight="700">In Reality</text>
  <text x="74" y="180" text-anchor="middle" class="label business-label" font-size="14" font-weight="700">Business Forms</text>
  <line x1="74" y1="194" x2="74" y2="655" stroke="#E8A0A0" stroke-width="2.2"/>

  <text x="640" y="158" text-anchor="middle" class="label ontology-label" font-size="17" font-weight="700">Ontology</text>
  <line x1="640" y1="172" x2="640" y2="655" stroke="#B8A8E8" stroke-width="2" stroke-dasharray="7 7"/>

  <text x="1206" y="157" text-anchor="middle" class="label database-label" font-size="17" font-weight="700">Database</text>
  <line x1="1206" y1="177" x2="1206" y2="655" stroke="#8BB8DF" stroke-width="2.2"/>

  <!-- Ontology layer and business connection -->
  <line x1="242" y1="364" x2="74" y2="364" stroke="#D44040" stroke-width="2.5" class="flow"/>
  <rect x="250" y="326" width="192" height="76" rx="12" fill="#EEE8FF" stroke="#B8A8E8" stroke-width="1.8" filter="url(#softShadow)"/>
  <g transform="translate(268 354)" fill="none" stroke="#7463B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h10M10 7v9M10 16H3M10 16h7"/>
    <rect x="1" y="1" width="7" height="6" rx="1.5"/>
    <rect x="12" y="1" width="7" height="6" rx="1.5"/>
    <rect x="0" y="14" width="7" height="6" rx="1.5"/>
    <rect x="13" y="14" width="7" height="6" rx="1.5"/>
  </g>
  <text x="300" y="371" text-anchor="start" class="label ontology-label" font-size="15" font-weight="800">Ontology Layer</text>

  <!-- Ontology layer to model -->
  <line x1="442" y1="364" x2="560" y2="364" stroke="#6AAAD8" stroke-width="2.5" class="flow"/>

  <!-- Ontology model / instance -->
  <rect x="560" y="316" width="160" height="96" rx="12" fill="url(#modelGrad)" stroke="#8BB8DF" stroke-width="1.8" filter="url(#softShadow)"/>
  <path d="M581 341h18M581 351h26M581 361h21" stroke="#4A90D4" stroke-width="2" stroke-linecap="round"/>
  <text x="640" y="386" text-anchor="middle" class="label model-label" font-size="20" font-weight="800">T-box</text>

  <rect x="560" y="412" width="160" height="96" rx="12" fill="url(#modelGrad)" stroke="#8BB8DF" stroke-width="1.8" filter="url(#softShadow)"/>
  <rect x="583" y="445" width="12" height="6" rx="2" fill="#6AAAD8"/>
  <rect x="601" y="445" width="12" height="6" rx="2" fill="#6AAAD8"/>
  <rect x="619" y="445" width="12" height="6" rx="2" fill="#6AAAD8"/>
  <path d="M589 448h36" stroke="#6AAAD8" stroke-width="1.5"/>
  <text x="640" y="475" text-anchor="middle" class="label model-label" font-size="20" font-weight="800">A-box</text>

  <!-- Instance to semantic layer and database -->
  <line x1="720" y1="460" x2="826" y2="460" stroke="#4A90D4" stroke-width="2.5" class="flow"/>
  <rect x="835" y="422" width="192" height="76" rx="12" fill="#EEE8FF" stroke="#B8A8E8" stroke-width="1.8" filter="url(#softShadow)"/>
  <g transform="translate(851 450)" fill="none" stroke="#7463B3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="20" height="19" rx="3"/>
    <path d="M5 6h12M5 10h12M5 14h7"/>
  </g>
  <text x="883" y="467" text-anchor="start" class="label ontology-label" font-size="15" font-weight="800">Semantic Layer</text>
  <line x1="1027" y1="460" x2="1198" y2="460" stroke="#4A90D4" stroke-width="2.5" class="flow"/>

  <!-- Ontology concepts -->
  <text x="346" y="460" text-anchor="middle" class="small-label" font-size="12" font-weight="700" letter-spacing="1">Business Concepts</text>
  <line x1="346" y1="402" x2="346" y2="443" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="346" y1="475" x2="346" y2="508" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="160" y1="508" x2="532" y2="508" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="160" y1="508" x2="160" y2="535" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="284" y1="508" x2="284" y2="535" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="408" y1="508" x2="408" y2="535" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="532" y1="508" x2="532" y2="535" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>

  <g filter="url(#softShadow)">
    <rect x="104" y="546" width="112" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="228" y="546" width="112" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="352" y="546" width="112" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="476" y="546" width="112" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
  </g>
  <g transform="translate(151 561)" fill="none" stroke="#8C6A15" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 17V10M8 17V5M14 17V1M0 17h18"/>
  </g>
  <g transform="translate(274 561)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="0" width="8" height="6" rx="1.5"/>
    <rect x="0" y="13" width="8" height="6" rx="1.5"/>
    <rect x="12" y="13" width="8" height="6" rx="1.5"/>
    <path d="M10 6v4M4 10h12M4 10v3M16 10v3"/>
  </g>
  <g transform="translate(398 561)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 5 10 1l8 4-8 4zM2 5v9l8 4 8-4V5M10 9v9"/>
  </g>
  <g transform="translate(522 555)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="1" width="7" height="6" rx="1.5"/>
    <rect x="13" y="1" width="7" height="6" rx="1.5"/>
    <rect x="6.5" y="13" width="7" height="6" rx="1.5"/>
    <path d="M7 4h6M10 7v6"/>
  </g>
  <text x="160" y="605" text-anchor="middle" class="label concept-label" font-size="14" font-weight="700">Metrics</text>
  <text x="284" y="605" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">Analysis Logic</text>
  <text x="408" y="605" text-anchor="middle" class="label concept-label" font-size="15" font-weight="700">Entity</text>
  <text x="532" y="592" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">
    <tspan x="532">Relations</tspan><tspan x="532" dy="16">+ Attributes</tspan>
  </text>

  <!-- Semantic definitions -->
  <text x="931" y="520" text-anchor="middle" class="small-label" font-size="12" font-weight="700" letter-spacing="1">Data Definitions</text>
  <line x1="931" y1="498" x2="931" y2="506" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="931" y1="527" x2="931" y2="535" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="766" y1="535" x2="1096" y2="535" stroke="#B8A8E8" stroke-width="2" class="flow"/>
  <line x1="766" y1="535" x2="766" y2="558" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="876" y1="535" x2="876" y2="558" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="986" y1="535" x2="986" y2="558" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>
  <line x1="1096" y1="535" x2="1096" y2="558" stroke="#B8A8E8" stroke-width="2" marker-end="url(#arrowLavender)"/>

  <g filter="url(#softShadow)">
    <rect x="713" y="569" width="106" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="823" y="569" width="106" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="933" y="569" width="106" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
    <rect x="1043" y="569" width="106" height="76" rx="12" fill="#FFF2CC" stroke="#E6C96E" stroke-width="1.8"/>
  </g>
  <g transform="translate(756 584)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1 4v11h18M5 12V9M9 12V7M13 12V9M17 12V7"/>
  </g>
  <g transform="translate(866 584)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 1v17M2 9.5h16M5 5l10 10M15 5 5 15"/>
  </g>
  <g transform="translate(976 584)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 1h10l4 4v13H3zM13 1v4h4M6 9h8M6 12h8M6 15h5"/>
  </g>
  <g transform="translate(1086 578)" fill="none" stroke="#8C6A15" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="2" width="18" height="15" rx="2"/>
    <path d="M1 7h18M7 2v15M13 7v10"/>
  </g>
  <text x="766" y="628" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">Measurement</text>
  <text x="876" y="628" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">Dimension</text>
  <text x="986" y="628" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">Field Def.</text>
  <text x="1096" y="615" text-anchor="middle" class="label concept-label" font-size="11" font-weight="700">
    <tspan x="1096">Schema</tspan><tspan x="1096" dy="14">+ Tables</tspan>
  </text>

</svg>
